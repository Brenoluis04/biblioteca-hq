# ===== Banco de dados H2 em modo ARQUIVO =====
# Os dados ficam salvos na pasta ./data (arquivo gibiteca.mv.db)
# e continuam la mesmo depois de fechar a aplicacao.
spring.datasource.url=jdbc:h2:file:./data/gibiteca;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ===== JPA / Hibernate =====
# update = cria/atualiza as tabelas sozinho a partir das entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# permite rodar o data.sql (seed) depois do Hibernate criar as tabelas
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# ===== Console do H2 (util para mostrar o banco ao professor) =====
# Acesse: http://localhost:8080/h2-console
spring.h2.console.enabled=true

# ===== Upload de arquivos de HQ =====
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB
app.pasta-hqs=./data/comics

server.port=8080
